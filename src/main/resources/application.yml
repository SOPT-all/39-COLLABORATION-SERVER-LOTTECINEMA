spring:
  datasource:
    url: "jdbc:mysql://localhost:3306/lottecinema?createDatabaseIfNotExist=true" #lottecinema 데이터베이스가 없으면 MySQL 드라이버가 생성
    username: ${DB_USERNAME:root} # local mysql username
    password: ${DB_PASSWORD} # local mysql password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true

# swagger-typescript-api에서 nullable enum의 null 타입을 보존하도록 3.0 명세를 제공합니다.
springdoc:
  api-docs:
    version: OPENAPI_3_0

# 영화 목록 기준일: 미설정 시 시연 날짜를 기본값으로 사용 (YYYY-MM-DD)
movie:
  list:
    reference-date: ${MOVIE_LIST_REFERENCE_DATE:2026-10-27}

# 모든 회차에 동일하게 적용하는 관람 유형별 1인 단가 (원)
ticket:
  prices:
    adult: 15000
    teen: 12000
    senior: 10000
    disabled: 10000

# AWS S3
cloud:
  aws:
    region: ${AWS_REGION:ap-northeast-2}
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
    s3:
      bucket: ${AWS_S3_BUCKET:}
