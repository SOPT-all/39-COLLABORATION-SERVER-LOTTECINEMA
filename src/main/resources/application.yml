spring:
  application:
    name: lottecinema-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:${DB_PORT:3307}/${DB_NAME:lottecinema}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

cloud:
  aws:
    region: ap-northeast-2
    s3:
      bucket: ${S3_BUCKET:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger.html
    tags-sorter: alpha
    operations-sorter: method