spring:
  datasource:
    url: "jdbc:mysql://localhost:3306/lottecinema?createDatabaseIfNotExist=true" #lottecinema 데이터베이스가 없으면 MySQL 드라이버가 생성
    username: ${DB_USERNAME:root} # local mysql username
    password: ${DB_PASSWORD} # local mysql password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true

# AWS S3
cloud:
  aws:
    region: ${AWS_REGION:ap-northeast-2}
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
    s3:
      bucket: ${AWS_S3_BUCKET:}
