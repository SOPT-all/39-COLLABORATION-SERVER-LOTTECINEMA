services:
  mysql:
    image: mysql:8.4
    container_name: lottecinema-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root1234}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lottecinema}
      TZ: Asia/Seoul
    ports:
      - "${MYSQL_LOCAL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  mysql-data:
